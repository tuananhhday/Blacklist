services:
  - type: web
    name: blacklist-studio
    runtime: python
    plan: 0.5c-512mb
    buildCommand: python -m compileall -q app.py
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: STUDIO_PASSWORD
        sync: false
      - key: STUDIO_USERNAME
        value: admin
      - key: STUDIO_DATA
        value: /var/data/database
      - key: STUDIO_EXPORTS
        value: /var/data/exports
    disk:
      name: studio-data
      mountPath: /var/data
      sizeGB: 1
