services:
  - type: web
    name: blacklist-studio
    runtime: python
    plan: free
    buildCommand: python -m compileall -q app.py
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: STUDIO_PASSWORD
        sync: false
      - key: STUDIO_USERNAME
        value: admin
      - key: STUDIO_DATA
        value: /tmp/blacklist-studio/database
      - key: STUDIO_EXPORTS
        value: /tmp/blacklist-studio/exports
