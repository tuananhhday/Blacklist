services:
  - type: web
    name: blacklist-studio
    runtime: python
    plan: free
    buildCommand: python -m compileall -q app.py accounts.py administration.py collaboration.py git_backup.py
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: STUDIO_PASSWORD
        sync: false
      - key: STUDIO_USERNAME
        value: admin
      - key: STUDIO_DATA
        value: /tmp/blacklist-studio/database
      - key: STUDIO_EXPORTS
        value: /tmp/blacklist-studio/exports
      - key: GITHUB_BACKUP_REPO
        value: tuananhhday/backup-blacklist
      - key: GITHUB_BACKUP_BRANCH
        value: main
      - key: GITHUB_BACKUP_TOKEN
        sync: false
